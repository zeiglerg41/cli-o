[project]
name = "clio-ai"
version = "0.1.0"
description = "Self-hosted AI coding assistant - Claude Code alternative with your own models"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "CLIO Team"}
]
keywords = ["ai", "assistant", "coding", "cli", "llm", "claude", "chatgpt", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "prompt_toolkit>=3.0",
    "httpx>=0.27",
    "aiofiles>=23.0",
    "watchdog>=4.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "click>=8.1",
    "tiktoken>=0.7",
    "pathspec>=0.12",
    "openai>=1.0",
    "websockets>=12.0",
    "simple-term-menu>=1.6",
    "sentence-transformers>=2.0",
    "chromadb>=0.4",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "black", "ruff"]

[project.scripts]
clio = "clio.cli:main"

[project.urls]
Homepage = "https://github.com/your-username/clio"
Repository = "https://github.com/your-username/clio"
Issues = "https://github.com/your-username/clio/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
